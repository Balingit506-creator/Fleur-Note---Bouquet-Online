<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efe7" id="meta-theme">
  <!-- lets embedded players (YouTube) see which site they are on -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <script>
    // Pick the theme before the page paints: the visitor's saved choice, else the device setting.
    (function () {
      var t = null;
      try { t = localStorage.getItem('petal-post-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <title>Fleur &amp; Note — Digital Bouquets</title>
  <meta name="description" content="Compose a hand-tied digital bouquet, write a letter, and send it as a private link.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
</head>

</body>
</html>
