  <rect width="600" height="400" fill="#c9a57f"/>
  <rect width="600" height="400" fill="url(#vig)"/>
  <pattern id="fib" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M5,12 q8,-3 14,2 M40,44 q6,4 13,0 M30,8 q3,6 9,7" stroke="#6d4e33" stroke-width=".7" fill="none" opacity=".35"/></pattern><rect width="600" height="400" fill="url(#fib)"/>
  <rect width="600" height="400" filter="url(#grain)"/>
