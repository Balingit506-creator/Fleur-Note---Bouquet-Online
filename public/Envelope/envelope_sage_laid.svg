<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .14"/></feComponentTransfer>
  </filter>
  <radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#a9b597" stop-opacity="0"/><stop offset="1" stop-color="#a9b597" stop-opacity=".9"/></radialGradient>
  </defs>
  <rect width="600" height="400" fill="#c3cbb3"/>
  <rect width="600" height="400" fill="url(#vig)"/>
  <pattern id="laid" width="600" height="5" patternUnits="userSpaceOnUse"><path d="M0,2.5 H600" stroke="#6d7a5d" stroke-width=".5" opacity=".18"/></pattern><rect width="600" height="400" fill="url(#laid)"/>
  <rect width="600" height="400" filter="url(#grain)"/>
</svg>
