<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .14"/></feComponentTransfer>
  </filter>
  <radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#bfb0d4" stop-opacity="0"/><stop offset="1" stop-color="#bfb0d4" stop-opacity=".9"/></radialGradient>
  </defs>
  <rect width="600" height="400" fill="#d8cde6"/>
  <rect width="600" height="400" fill="url(#vig)"/>
  
  <rect width="600" height="400" filter="url(#grain)"/>
</svg>
