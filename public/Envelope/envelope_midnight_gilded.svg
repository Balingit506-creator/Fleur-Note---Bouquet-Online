<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .14"/></feComponentTransfer>
  </filter>
  <radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#141c30" stop-opacity="0"/><stop offset="1" stop-color="#141c30" stop-opacity=".9"/></radialGradient>
  </defs>
  <rect width="600" height="400" fill="#1f2a44"/>
  <rect width="600" height="400" fill="url(#vig)"/>
  <pattern id="fleck" width="90" height="90" patternUnits="userSpaceOnUse"><circle cx="12" cy="20" r="1.1" fill="#d8b56a"/><circle cx="64" cy="58" r=".8" fill="#e8cf91"/><circle cx="40" cy="80" r="1.4" fill="#c9a45c" opacity=".8"/><circle cx="78" cy="14" r=".6" fill="#f2e2b6"/></pattern><rect width="600" height="400" fill="url(#fleck)"/>
  <rect width="600" height="400" filter="url(#grain)"/>
</svg>
